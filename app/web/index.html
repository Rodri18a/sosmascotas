<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SOS Mascota: app para dueños de mascotas y comercios del rubro.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOS Mascota">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SOS Mascota</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F5E7A">
  <style>
    /* Pantalla de carga con la identidad Cielo (D62). La huella es provisoria hasta el logo (0.0.9b). */
    @font-face {
      font-family: 'Sora'; font-weight: 600; font-display: swap;
      src: url(assets/assets/fuentes/Sora-SemiBold.ttf) format('truetype');
    }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #0F5E7A; color: #fff;
      font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #carga .logo { font-size: 72px; animation: latido 1.2s ease-in-out infinite; }
    #carga .nombre { font-size: 28px; font-weight: 600; }
    @keyframes latido { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #carga .logo { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="carga" role="status" aria-label="Cargando SOS Mascota">
    <div class="logo" aria-hidden="true">🐾</div>
    <div class="nombre">SOS Mascota</div>
  </div>
  <script>
    // Se quita cuando Flutter dibuja la primera pantalla.
    window.addEventListener('flutter-first-frame', () => document.getElementById('carga')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
