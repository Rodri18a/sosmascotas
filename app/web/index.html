<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Encontrá veterinarias, avisá si se pierde tu mascota y ayudá a las de tu barrio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Huellitas">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Huellitas</title>
  <script>
    // Instalar la app (0.8.1): el navegador avisa una sola vez y puede ser
    // antes de que arranque Flutter; se guarda acá y la app lo usa después.
    window.sosInstalacion = { aviso: null, instalada: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); // en lugar de la barra del navegador, el botón propio
      window.sosInstalacion.aviso = e;
      window.dispatchEvent(new Event('sos-instalacion'));
    });
    window.addEventListener('appinstalled', function () {
      window.sosInstalacion.instalada = true;
      window.sosInstalacion.aviso = null;
      window.dispatchEvent(new Event('sos-instalacion'));
    });
  </script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#126FA3">
  <style>
    /* Pantalla de carga con el logo y los colores de la guía visual (D126). */
    @font-face {
      font-family: 'Nunito'; font-weight: 900; font-display: swap;
      src: url(assets/assets/fuentes/Nunito-Black.ttf) format('truetype');
    }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #F2F8FC; color: #13294B;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #carga .logo { width: 112px; height: 112px; animation: latido 1.2s ease-in-out infinite; }
    #carga .nombre { font-size: 30px; font-weight: 900; }
    @media (prefers-color-scheme: dark) { #carga { background: #0E1A26; color: #E8F1F8; } }
    @keyframes latido { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #carga .logo { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="carga" role="status" aria-label="Cargando Huellitas">
    <img class="logo" src="icons/isotipo.png" alt="">
    <div class="nombre">Huellitas</div>
  </div>
  <script>
    // Se quita cuando Flutter dibuja la primera pantalla.
    window.addEventListener('flutter-first-frame', () => document.getElementById('carga')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
