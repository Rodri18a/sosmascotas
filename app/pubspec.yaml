name: sosmascota
description: "Huellitas: app para dueños de mascotas y comercios del rubro."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  http: ^1.6.0
  sosmascota_core:
    path: ../packages/core
  supabase_flutter: ^2.18.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  web: ^1.1.1
  url_launcher: ^6.3.3
  maplibre_gl: ^0.27.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  geolocator: ^14.1.1
  pdf: ^3.13.1
  file_picker: ^13.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.12.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/marca/
  # Tipografías de la identidad Cielo (D62), licencia OFL (ver assets/fuentes/).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fuentes/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fuentes/Nunito-Black.ttf
          weight: 900
    - family: NunitoSans
      fonts:
        - asset: assets/fuentes/NunitoSans-Regular.ttf
        - asset: assets/fuentes/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/NunitoSans-Bold.ttf
          weight: 700
