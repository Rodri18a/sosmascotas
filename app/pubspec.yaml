name: sosmascota
description: "SOS Mascota: app para dueños de mascotas y comercios del rubro."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  http: ^1.6.0
  sosmascota_core:
    path: ../packages/core
  supabase_flutter: ^2.18.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/legal/
