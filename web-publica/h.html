<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#126FA3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https://*.supabase.co; style-src 'self'">
  <title>Historial · Huellitas</title>
  <link rel="stylesheet" href="/assets/estilo.css">
  <link rel="icon" type="image/png" href="/assets/isotipo.png">
</head>
<body>
  <main>
    <header class="marca"><img src="/assets/isotipo.png" alt="" width="36" height="36"> Huellitas</header>

    <p id="cargando">Cargando…</p>

    <section id="estado" class="tarjeta" hidden>
      <h1 id="estado-titulo"></h1>
      <p id="estado-texto"></p>
    </section>

    <article id="historial" hidden>
      <div class="tarjeta">
        <div id="foto-contenedor"></div>
        <h1 id="nombre"></h1>
        <p id="detalle" class="detalle"></p>
        <p id="datos"></p>
        <p id="vence" class="ayuda"></p>
      </div>

      <section class="tarjeta">
        <h2>Libreta sanitaria</h2>
        <div id="libreta"></div>
      </section>

      <section class="tarjeta">
        <h2>Historial de vida</h2>
        <div id="vida"></div>
      </section>

      <p class="ayuda">Lo compartió la familia de la mascota, solo para leer. Los datos los cargó la familia: ante una duda, consultala.</p>
    </article>
  </main>
  <script src="/config.js"></script>
  <script src="/assets/comun.js"></script>
  <script src="/assets/historial.js"></script>
</body>
</html>
