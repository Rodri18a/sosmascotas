name: sosmascota_admin
description: "Portal de administración de SOS Mascota (etapa 1.8, D76)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  sosmascota_core:
    path: ../packages/core
  supabase_flutter: ^2.18.3
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Las tipografías de la marca (D62, D122), las mismas que la app; licencia
  # OFL (ver assets/fuentes/).
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fuentes/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Sora-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fuentes/SourceSans3-Regular.ttf
        - asset: assets/fuentes/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/SourceSans3-Bold.ttf
          weight: 700
