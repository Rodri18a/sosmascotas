name: sosmascota_admin
description: "Portal de administración de Huellitas (etapa 1.8, D76)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  sosmascota_core:
    path: ../packages/core
  supabase_flutter: ^2.18.3
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Las tipografías de la marca (D126), las mismas que la app; licencia
  # OFL (ver assets/fuentes/).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fuentes/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fuentes/Nunito-Black.ttf
          weight: 900
    - family: NunitoSans
      fonts:
        - asset: assets/fuentes/NunitoSans-Regular.ttf
        - asset: assets/fuentes/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/NunitoSans-Bold.ttf
          weight: 700
